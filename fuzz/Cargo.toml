[package]
name = "ws-kit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ws-kit = { path = ".." }

[[bin]]
name = "fuzz_codec"
path = "fuzz_targets/fuzz_codec.rs"
test = false
doc = false

[[bin]]
name = "fuzz_extract"
path = "fuzz_targets/fuzz_extract.rs"
test = false
doc = false
