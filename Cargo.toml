[package]
name = "ws-kit"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/ws-kit"
description = "Generic authenticated typed WebSocket — BroadcastHub, RoomManager, heartbeat, and token extraction for Axum"
keywords = ["websocket", "realtime", "axum", "broadcast"]
categories = ["web-programming", "asynchronous"]
exclude = ["/target"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
axum = { version = "0.8", features = ["ws"], optional = true }
tower = { version = "0.5", optional = true }
http = { version = "1", optional = true }
futures = { version = "0.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dashmap = "6"
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Model-checking tests (see src/loom_tests.rs). Activated only with
# RUSTFLAGS="--cfg loom"; the lib swaps std atomics for loom's equivalents.
[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
default = ["axum"]
axum = ["dep:axum", "dep:tower", "dep:http"]
tracing = ["dep:tracing"]

[[bench]]
name = "ws_bench"
harness = false

[[bench]]
name = "broadcast_roundtrip"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
panic = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
